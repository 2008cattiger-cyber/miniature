filebeat.inputs:
  - type: filestream
    id: tg-bot-logs
    paths:
      - /logs/*.jsonl
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
          ignore_decoding_error: true

processors:
  - add_fields:
      target: service
      fields:
        name: tg-bot

setup.template.enabled: false
setup.ilm.enabled: false

output.elasticsearch:
  hosts: ["https://opensearch:9200"]
  username: admin
  password: ${OPENSEARCH_ADMIN_PASSWORD}
  ssl.verification_mode: none
  index: "tg-bot-logs-%{+yyyy.MM.dd}"
